<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="60%" stop-color="#c59f4e"/>
      <stop offset="100%" stop-color="#8c6a23"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Disc / Frame -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85"/>

  <!-- Geometric Grid Accent (The City 26 Districts) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#252a3a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- The Moon (Golden Crescent) -->
  <path d="M42 12 A 20 20 0 0 0 20 44 A 20 20 0 1 1 42 12 Z" fill="url(#goldGrad)" />

  <!-- Monolithic City Spire (Brutalist Architecture) -->
  <!-- Flanking Wings -->
  <polygon points="16,36 23,33 23,50 16,50" fill="#181c28" stroke="#333a4d" stroke-width="1"/>
  <polygon points="41,33 48,36 48,50 41,50" fill="#181c28" stroke="#333a4d" stroke-width="1"/>

  <!-- Central Monolith (District 1 / Spire of The City) -->
  <polygon points="32,15 39,23 39,50 25,50 25,23" fill="#10131d" stroke="url(#goldGrad)" stroke-width="1.6"/>

  <!-- Red Singularity Eye / Carmen's Core Beacon -->
  <polygon points="32,20 35,25 32,30 29,25" fill="url(#redGrad)" filter="url(#glow)"/>
  <line x1="32" y1="33" x2="32" y2="46" stroke="url(#redGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Horizon Line & Geometric Marker -->
  <line x1="12" y1="50" x2="52" y2="50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="54" r="1.5" fill="#f5d77f"/>
</svg>
